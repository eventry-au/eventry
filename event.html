<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Details — Eventry</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0d0d0d; --ink-muted: #5a5a5a; --ink-faint: #9a9a9a;
    --surface: #f5f3ef; --white: #ffffff; --accent: #e8572a;
    --accent-light: #fdf0eb; --border: #e2dfd8; --border-strong: #c8c4bc;
    --card-radius: 16px; --pill-radius: 100px;
    --success: #2e7d32; --success-light: #f1f8f1;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1.7; min-height: 100vh; }

  /* NAV */
  nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--ink); text-decoration: none; display: flex; flex-direction: column; line-height: 1; gap: 3px; }
  .logo-name { display: block; white-space: nowrap; }
  .logo-name .orange { color: var(--accent); }
  .logo-tagline { font-size: 9px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint); font-family: 'DM Sans', sans-serif; display: block; white-space: nowrap; }
  .nav-back { font-size: 13px; color: var(--ink-muted); text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: 500; transition: color 0.15s; }
  .nav-back:hover { color: var(--accent); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 14px; color: var(--ink-muted); text-decoration: none; font-weight: 500; transition: color 0.15s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { background: var(--ink); color: var(--white) !important; padding: 8px 18px; border-radius: var(--pill-radius); font-size: 13px !important; }
  .nav-cta:hover { background: var(--accent) !important; }

  /* HAMBURGER */
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 6px; border: none; background: none; z-index: 200; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 0.3s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .mobile-drawer { display: none; position: fixed; top: 60px; right: 0; width: 280px; height: calc(100vh - 60px); background: var(--white); border-left: 1px solid var(--border); z-index: 150; padding: 2rem 1.5rem; flex-direction: column; gap: 0; transform: translateX(100%); transition: transform 0.3s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.08); }
  .mobile-drawer.open { transform: translateX(0); }
  .mobile-drawer a { display: block; padding: 1rem 0; font-size: 16px; font-weight: 500; color: var(--ink-muted); text-decoration: none; border-bottom: 1px solid var(--border); transition: color 0.15s; }
  .mobile-drawer a:hover { color: var(--accent); }
  .mobile-drawer .mobile-cta { margin-top: 1.5rem; background: var(--ink); color: var(--white) !important; text-align: center; padding: 14px !important; border-radius: var(--pill-radius); border-bottom: none !important; font-weight: 600 !important; }
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140; }
  .drawer-overlay.open { display: block; }

  /* LOADING */
  .loading-state { text-align: center; padding: 5rem 2rem; color: var(--ink-muted); }
  .loading-state .icon { font-size: 48px; margin-bottom: 1rem; }

  /* PAGE LAYOUT */
  .page-wrap { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 4rem; }

  /* BREADCRUMB */
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-faint); margin-bottom: 1.5rem; flex-wrap: wrap; }
  .breadcrumb a { color: var(--ink-muted); text-decoration: none; transition: color 0.15s; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb span { color: var(--ink-faint); }

  /* EVENT HEADER */
  .event-header { background: var(--white); border-radius: var(--card-radius); border: 1px solid var(--border); padding: 2rem; margin-bottom: 1.5rem; }
  .event-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .event-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sport-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; padding: 4px 12px; border-radius: var(--pill-radius); }
  .featured-badge { background: var(--accent); color: white; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 12px; border-radius: var(--pill-radius); }
  .event-actions { display: flex; gap: 8px; align-items: center; }
  .action-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--pill-radius); border: 1px solid var(--border); background: var(--white); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; color: var(--ink-muted); cursor: pointer; text-decoration: none; transition: all 0.15s; white-space: nowrap; }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .event-title { font-family: 'Syne', sans-serif; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; margin-bottom: 1.25rem; }
  .event-meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; }
  .meta-item { display: flex; align-items: flex-start; gap: 10px; }
  .meta-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--ink-muted); }
  .meta-label { font-size: 11px; color: var(--ink-faint); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .meta-value { font-size: 14px; color: var(--ink); font-weight: 500; }
  .meta-link { color: var(--accent); text-decoration: none; }
  .meta-link:hover { text-decoration: underline; }

  /* ORGANISER BAR */
  .organiser-bar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background: var(--surface); border-radius: 10px; margin-top: 1.25rem; flex-wrap: wrap; gap: 10px; }
  .org-info { display: flex; align-items: center; gap: 10px; }
  .org-logo { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; flex-shrink: 0; }
  .org-name { font-weight: 600; font-size: 14px; }
  .org-sub { font-size: 12px; color: var(--ink-faint); }
  .org-link { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
  .org-link:hover { text-decoration: underline; }

  /* SECTIONS */
  .section-card { background: var(--white); border-radius: var(--card-radius); border: 1px solid var(--border); padding: 1.75rem; margin-bottom: 1.5rem; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
  .section-title-icon { font-size: 18px; }

  /* DESCRIPTION */
  .event-description { font-size: 15px; color: var(--ink-muted); line-height: 1.8; }

  /* DISCIPLINES TABLE */
  .disciplines-table { width: 100%; border-collapse: collapse; }
  .disciplines-table thead tr { background: var(--surface); }
  .disciplines-table th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); border-bottom: 1px solid var(--border); }
  .disciplines-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .disciplines-table tr:last-child td { border-bottom: none; }
  .disciplines-table tr:hover td { background: var(--surface); }
  .disc-name { font-weight: 600; color: var(--ink); }
  .disc-dist { color: var(--ink-muted); font-size: 13px; }
  .disc-price { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
  .disc-price.free { color: var(--success); }
  .register-btn { display: inline-flex; align-items: center; gap: 5px; background: var(--ink); color: white; padding: 7px 14px; border-radius: var(--pill-radius); font-size: 12px; font-weight: 500; text-decoration: none; transition: background 0.15s; white-space: nowrap; }
  .register-btn:hover { background: var(--accent); }

  /* CUSTOM LEGS */
  .legs-display { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 0.5rem; }
  .leg-tag { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--ink-muted); }
  .leg-arrow { color: var(--ink-faint); font-size: 12px; }

  /* EVENT INFO GRID */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .info-item { }
  .info-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .info-value { font-size: 14px; color: var(--ink); font-weight: 500; }

  /* CALENDAR BUTTONS */
  .calendar-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem; }
  .cal-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--pill-radius); border: 1px solid var(--border); background: var(--white); font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; color: var(--ink-muted); cursor: pointer; text-decoration: none; transition: all 0.15s; }
  .cal-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* SHARE TOAST */
  .share-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--white); padding: 10px 20px; border-radius: var(--pill-radius); font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; }
  .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* NOT FOUND */
  .not-found { text-align: center; padding: 5rem 2rem; }
  .not-found h2 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 1rem; }
  .not-found p { color: var(--ink-muted); margin-bottom: 2rem; }
  .not-found a { background: var(--ink); color: white; padding: 12px 28px; border-radius: var(--pill-radius); text-decoration: none; font-weight: 500; }

  /* SPORT COLORS */
  .sport-running { background: #fff3e0; color: #e65100; }
  .sport-cycling { background: #e3f2fd; color: #1565c0; }
  .sport-triathlon { background: #f3e5f5; color: #6a1b9a; }
  .sport-obstacle { background: #fce4ec; color: #880e4f; }
  .sport-paddling { background: #e0f7fa; color: #00695c; }
  .sport-hiking { background: #f1f8e9; color: #33691e; }
  .sport-fitness { background: #fff8e1; color: #f57f17; }
  .sport-openwater { background: #e1f5fe; color: #01579b; }
  .sport-other { background: #f5f5f5; color: #555; }

  @media (max-width: 768px) {
    .hamburger { display: flex; }
    .mobile-drawer { display: flex; }
    .nav-links { display: none; }
    .event-header-top { flex-direction: column; }
    .event-actions { flex-wrap: wrap; }
    .event-meta-grid { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .disciplines-table thead { display: none; }
    .disciplines-table tr { display: block; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .disciplines-table td { display: block; padding: 4px 0; border: none; }
  }
</style>
</head>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5LNMivIm3qrjOkLsGfmBZI2jb35SU3RQYMQ_EqJQfinbxZIC-EHcIHclv_lfzaLFgfw/exec';

const SPORT_CLASSES = {
  'Running': 'sport-running', 'running': 'sport-running',
  'Cycling': 'sport-cycling', 'cycling_road': 'sport-cycling',
  'Cycling MTB': 'sport-cycling', 'cycling_mtb': 'sport-cycling',
  'Triathlon': 'sport-triathlon', 'triathlon': 'sport-triathlon',
  'Obstacle Racing': 'sport-obstacle', 'obstacle': 'sport-obstacle',
  'Paddling': 'sport-paddling', 'paddling': 'sport-paddling',
  'Open Water Swimming': 'sport-openwater', 'openwater': 'sport-openwater',
  'Hiking': 'sport-hiking', 'hiking': 'sport-hiking',
  'Fitness': 'sport-fitness', 'fitness': 'sport-fitness',
  'other': 'sport-other', 'Other': 'sport-other',
};

const ORG_COLORS = {
  'Adventure Co': '#e8572a', 'Peak Events': '#1565c0',
  'Endure Sports': '#2e7d32', 'Blue Water Events': '#00695c',
  'Alpine Events': '#6a1b9a',
};

function toggleDrawer() {
  const hamburger = document.getElementById('hamburger');
  const drawer = document.getElementById('mobileDrawer');
  const overlay = document.getElementById('drawerOverlay');
  hamburger.classList.toggle('open');
  drawer.classList.toggle('open');
  overlay.classList.toggle('open');
  document.body.style.overflow = drawer.classList.contains('open') ? 'hidden' : '';
}

function orgInitials(name) {
  return (name || '').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}

function formatDate(dateStr) {
  if (!dateStr) return 'Date TBC';
  let d;
  if (typeof dateStr === 'number') {
    d = new Date((dateStr - 25569) * 86400 * 1000);
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr))) {
    d = new Date(dateStr + 'T00:00:00');
  } else {
    d = new Date(dateStr);
  }
  if (isNaN(d.getTime())) return String(dateStr);
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  let d;
  if (typeof dateStr === 'number') d = new Date((dateStr - 25569) * 86400 * 1000);
  else if (/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr))) d = new Date(dateStr + 'T00:00:00');
  else d = new Date(dateStr);
  if (isNaN(d.getTime())) return String(dateStr);
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function mapsLink(venue, location) {
  const query = encodeURIComponent(venue || location || '');
  return `https://maps.google.com/?q=${query}`;
}

function googleCalLink(name, dateStr, endDateStr, location, description) {
  const start = dateStr ? dateStr.replace(/-/g,'') : '';
  const end = endDateStr ? endDateStr.replace(/-/g,'') : start;
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: name,
    dates: `${start}/${end}`,
    location: location || '',
    details: description || ''
  });
  return `https://calendar.google.com/calendar/render?${params}`;
}

function icalLink(name, dateStr, endDateStr, location, description) {
  const start = dateStr ? dateStr.replace(/-/g,'') : '';
  const end = endDateStr ? endDateStr.replace(/-/g,'') : start;
  const ical = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'BEGIN:VEVENT',
    `DTSTART:${start}`,
    `DTEND:${end}`,
    `SUMMARY:${name}`,
    `LOCATION:${location || ''}`,
    `DESCRIPTION:${(description || '').replace(/\n/g,' ')}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\n');
  const blob = new Blob([ical], { type: 'text/calendar' });
  return URL.createObjectURL(blob);
}

function shareEvent(name, id) {
  const url = `${window.location.origin}/event.html?id=${id}`;
  if (navigator.share) {
    navigator.share({ title: name, text: `Check out ${name} on Eventry!`, url });
  } else {
    navigator.clipboard.writeText(url).then(() => {
      const toast = document.getElementById('shareToast');
      toast.textContent = '✓ Link copied to clipboard!';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    });
  }
}

function renderLegs(legsStr) {
  try {
    const legs = typeof legsStr === 'string' ? JSON.parse(legsStr) : legsStr;
    if (!legs || !legs.length) return '';
    return `<div class="legs-display">
      ${legs.map((leg, i) => `
        <span class="leg-tag">${leg.activity} ${leg.dist_value}${leg.dist_unit}</span>
        ${i < legs.length - 1 ? '<span class="leg-arrow">→</span>' : ''}
      `).join('')}
    </div>`;
  } catch(e) { return ''; }
}

function renderEvent(event) {
  const sport = event.disciplines?.[0]?.sport || 'other';
  const subtype = event.disciplines?.[0]?.subtype || '';
  const sportClass = SPORT_CLASSES[sport] || 'sport-other';
  const orgColor = ORG_COLORS[event.org_name] || '#555';
  const badgeLabel = subtype ? `${sport} · ${subtype}` :
    (sport === 'other' || sport === 'Other') ? 'Other / Custom' : sport;

  const isSameDate = event.event_date === event.event_end_date;
  const dateDisplay = isSameDate
    ? formatDate(event.event_date)
    : `${formatDateShort(event.event_date)} – ${formatDateShort(event.event_end_date)}`;

  const venueOrLocation = event.venue || `${event.location}, ${event.state}`;
  const mapsUrl = mapsLink(venueOrLocation, `${event.location}, ${event.state}`);
  const gcalUrl = googleCalLink(event.event_name, event.event_date, event.event_end_date, venueOrLocation, event.event_description);

  document.title = `${event.event_name} — Eventry`;

  return `
  <div class="page-wrap">
    <div class="breadcrumb">
      <a href="index.html">← Browse Events</a>
      <span>/</span>
      <span>${event.event_name}</span>
    </div>

    <!-- EVENT HEADER -->
    <div class="event-header">
      <div class="event-header-top">
        <div class="event-badges">
          <span class="sport-badge ${sportClass}">${badgeLabel}</span>
          ${event.featured ? '<span class="featured-badge">⭐ Featured</span>' : ''}
        </div>
        <div class="event-actions">
          <button class="action-btn" onclick="shareEvent('${event.event_name.replace(/'/g,"\\'")}','${event.submission_id}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Share
          </button>
          <a href="${event.event_url || '#'}" target="_blank" class="action-btn" style="background:var(--ink);color:white;border-color:var(--ink)">
            Official site →
          </a>
        </div>
      </div>

      <h1 class="event-title">${event.event_name}</h1>

      <div class="event-meta-grid">
        <div class="meta-item">
          <div class="meta-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div>
            <div class="meta-label">Date</div>
            <div class="meta-value">${dateDisplay}</div>
          </div>
        </div>

        <div class="meta-item">
          <div class="meta-icon">

function addToICal(name, dateStr, endDateStr, location) {
  const start = dateStr ? dateStr.replace(/-/g,'') : '';
  const end = endDateStr ? endDateStr.replace(/-/g,'') : start;
  const ical = [
    'BEGIN:VCALENDAR', 'VERSION:2.0',
    'BEGIN:VEVENT',
    `DTSTART;VALUE=DATE:${start}`,
    `DTEND;VALUE=DATE:${end}`,
    `SUMMARY:${name}`,
    `LOCATION:${location}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ical], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${name.replace(/[^a-z0-9]/gi,'_')}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

async function loadEvent(eventId) {
  try {
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if (json.success && json.events) {
      return json.events.find(e => String(e.submission_id) === String(eventId)) || null;
    }
  } catch(err) {
    console.log('Using sample data');
  }
  // Fallback to sample
  return sampleEvents.find(e => String(e.submission_id) === String(eventId)) || null;
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const eventId = params.get('id');

  if (!eventId) {
    document.getElementById('pageContent').innerHTML = `
      <div class="not-found">
        <div style="font-size:48px;margin-bottom:1rem">🔍</div>
        <h2>No event specified</h2>
        <p>Head back to browse all events.</p>
        <a href="index.html">Browse Events</a>
      </div>`;
    return;
  }

  const event = await loadEvent(eventId);

  if (!event) {
    document.getElementById('pageContent').innerHTML = `
      <div class="not-found">
        <div style="font-size:48px;margin-bottom:1rem">😕</div>
        <h2>Event not found</h2>
        <p>This event may have been removed or the link may be incorrect.</p>
        <a href="index.html">Browse Events</a>
      </div>`;
    return;
  }

  document.getElementById('pageContent').innerHTML = renderEvent(event);
}
